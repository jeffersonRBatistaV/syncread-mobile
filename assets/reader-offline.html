<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncRead Offline</title>
<style>
  /* Insets del sistema: la app nativa inyecta --safe-top/--safe-bottom con los
     valores reales (env() no funciona de forma fiable en file://) */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0A0A0A; font-family: Inter, system-ui, sans-serif; }
  #reader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: var(--safe-top);
    background: rgba(10,10,10,0.92); border-bottom: 1px solid #1F1F23;
  }
  .topbar button {
    background: none; border: none; color: #8A8A93; font-size: 20px;
    padding: 4px 10px; border-radius: 8px; cursor: pointer;
  }
  .topbar button:active { background: #1F1F23; }
  .topbar h1 { flex: 1; font-size: 14px; color: #EDEDED; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #host { position: fixed; top: calc(var(--safe-top) + 48px); bottom: calc(var(--safe-bottom) + 36px); left: 0; right: 0; }
  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 6px 12px; padding-bottom: var(--safe-bottom);
    background: rgba(10,10,10,0.92); border-top: 1px solid #1F1F23;
  }
  .bottombar span { font-size: 12px; color: #8A8A93; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .slider {
    flex: 1; margin: 0 12px; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: #1F1F23; border-radius: 999px; outline: none;
    touch-action: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #EDEDED; border: 2px solid #5E6AD2; cursor: pointer;
  }
  .slider:disabled { opacity: 0.4; }
  .zone { position: fixed; top: calc(var(--safe-top) + 48px); bottom: calc(var(--safe-bottom) + 36px); width: 25%; z-index: 10; }
  .zone.left { left: 0; }
  .zone.right { right: 0; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8A8A93; font-size: 14px; background: #0A0A0A; z-index: 5;
  }
  .spinner {
    width: 24px; height: 24px; border: 2px solid #1F1F23; border-top-color: #5E6AD2;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #F87171; font-size: 14px; text-align: center; padding: 24px; background: #0A0A0A; z-index: 6;
  }
</style>
</head>
<body>
<div class="topbar">
  <button onclick="goBack()">←</button>
  <h1 id="title">Libro</h1>
  <button onclick="goNext()">›</button>
</div>
<div class="zone left" onclick="goPrev()"></div>
<div class="zone right" onclick="goNext()"></div>
<div id="host"></div>
<div class="bottombar">
  <input type="range" id="progress" min="0" max="100" step="1" value="0" class="slider" aria-label="Barra de progreso del libro">
  <span id="counter"></span>
</div>
<div id="loading"><div class="spinner"></div><span>Cargando libro…</span></div>
<div id="error">No se pudo abrir el libro</div>
